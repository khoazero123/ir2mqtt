name: Build add-on image

# Builds the IR2MQTT (dev) add-on image for aarch64 + amd64 and publishes it to
# GHCR, so Home Assistant installs and updates the add-on by pulling a prebuilt
# image instead of compiling it on the HA host (a Pi 4 with 2 GB RAM cannot do
# that comfortably).
#
# Tags published:
#   <version>-aarch64 / <version>-amd64   per-architecture images
#   <version> / latest                    multi-arch manifests HA pulls
#
# <version> comes from ir2mqtt_dev/config.json — bump it to publish a release.

on:
  push:
    branches: [custom]
    paths:
      - "ir2mqtt_dev/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: addon-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ir2mqtt-ha-app

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.20
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.20
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: ver
        run: |
          version=$(jq -r .version ir2mqtt_dev/config.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "add-on version: $version"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: ir2mqtt_dev
          file: ir2mqtt_dev/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.title=IR2MQTT (dev)

  manifest:
    name: Publish multi-arch tags
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: ver
        run: echo "version=$(jq -r .version ir2mqtt_dev/config.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into a multi-arch tag
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ steps.ver.outputs.version }}"
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-aarch64" \
            "$IMAGE:$VERSION-amd64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Make the GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "/user/packages/container/ir2mqtt-ha-app" -f visibility=public \
            && echo "package visibility: public" \
            || echo "set visibility manually in the package settings"
